version: '3.8'

services:
  selfbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-selfbot
    volumes:
      - ./database:/app/database
      - ./sessions:/app/sessions
      - .:/app
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - ADMIN_ID=${ADMIN_ID}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    command: python main.py
